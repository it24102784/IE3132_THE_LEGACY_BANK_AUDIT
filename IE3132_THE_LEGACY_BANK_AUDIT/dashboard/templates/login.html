{% extends "base.html" %} {% block title %}Team Login{% endblock %} {% block
content %}
<div
  class="row justify-content-center align-items-center"
  style="min-height: 68vh"
>
  <div class="col-12 col-sm-9 col-md-6 col-lg-5">
    <section class="panel p-4 p-md-5">
      <p class="eyebrow mb-2">Authorized assessment</p>
      <h1 class="h3 mb-2">Team sign in</h1>
      <p class="text-secondary mb-4">
        Enter your audit team credentials to continue.
      </p>
      <form method="post" action="{{ url_for('login') }}">
        <div class="mb-3">
          <label class="form-label" for="username">Team username</label>
          <input
            class="form-control"
            id="username"
            name="username"
            autocomplete="username"
            required
          />
        </div>
        <div class="mb-4">
          <label class="form-label" for="password">Password</label>
          <input
            class="form-control"
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
        </div>
        <button class="btn btn-success w-100" type="submit">Sign in</button>
      </form>
      <p class="small text-secondary text-center mt-3 mb-0">
        No team yet? <a href="{{ url_for('register') }}">Register here</a>
      </p>
    </section>
  </div>
</div>
{% endblock %}
